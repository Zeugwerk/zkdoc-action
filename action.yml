name: 'Zeugwerk Doc Action'
description: 'Automatically generate and publish API documentation for TwinCAT/PLC projects using the Zeugwerk Doc service.'
branding:
  icon: 'book-open'
  color: 'gray-dark'
inputs:
  username:
    description: 'Username for authenticating with the Zeugwerk Doc service. Store this as a GitHub secret.'
    required: true
    default: ''
  password:
    description: 'Password for authenticating with the Zeugwerk Doc service. Store this as a GitHub secret.'
    required: true
    default: ''
  filepath:
    description: 'Space-separated path(s) to .plcproj file(s) or to folder(s) containing a config.json. Example: "src/MyPlc.plcproj" or "PlcA PlcB"'
    required: true
    default: ''
  doc-folder:
    description: 'Output folder where generated Markdown files and DocFX metadata files (toc.yml, etc.) will be written.'
    required: false
    default: 'documentation'
  working-directory:
    description: 'Root directory from which all paths are resolved. Defaults to the repository root.'
    required: false
    default: '.'
  artifact-name:
    description: 'File name for the downloaded build artifact archive. Defaults to "artifact.zip". Override this to avoid collisions when multiple build jobs upload artifacts in the same workflow run.'
    required: false
    default: 'artifact.zip'
    
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.username }}
    - ${{ inputs.password }}
    - ${{ inputs.filepath }}
    - ${{ inputs.doc-folder }}
    - ${{ inputs.working-directory }}
    - ${{ inputs.artifact-name }}    
